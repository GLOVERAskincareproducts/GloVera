<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Glovera | جلوفيرا</title>

    <meta name="description"
          content="Glovera - التوهج الأنثوي والبساطة والرقي بأدق التفاصيل. عناية بالبشرة والشعر والجسم.">

    <meta name="theme-color" content="#3f5d49">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap"
          rel="stylesheet">


    <style>

        /* =========================
           BASIC
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cairo", sans-serif;
            background: #fbf9f5;
            color: #304538;
            line-height: 1.8;
            overflow-x: hidden;
        }

        img {
            max-width: 100%;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button {
            font-family: inherit;
        }


        /* =========================
           VARIABLES
        ========================= */

        :root {
            --green: #3f5d49;
            --dark-green: #293c30;
            --soft-green: #e8eee8;

            --pink: #bd7f89;
            --soft-pink: #f3e5e7;

            --cream: #fbf9f5;
            --beige: #f3efe7;

            --text: #304538;
            --muted: #747e77;

            --border: #e7e1d8;

            --shadow:
                0 20px 60px rgba(43, 62, 50, 0.10);
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;

            height: 82px;

            background: rgba(251,249,245,0.94);
            backdrop-filter: blur(18px);

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;

            flex-shrink: 0;
        }

        .logo img {
            width: 145px;
            height: auto;
            display: block;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;

            font-size: 13px;
        }

        nav a {
            color: #536159;
            transition: 0.3s;
        }

        nav a:hover {
            color: var(--pink);
        }

        .header-btn {
            background: var(--green);
            color: white;

            padding: 10px 23px;

            border-radius: 30px;

            font-size: 13px;

            transition: 0.3s;
        }

        .header-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(63,93,73,0.20);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 680px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;

            padding: 75px 9%;

            position: relative;
            overflow: hidden;

            background:
                radial-gradient(
                    circle at 80% 35%,
                    #e6eee6 0,
                    transparent 35%
                ),
                var(--cream);
        }

        .hero::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: #f4e3e5;

            opacity: 0.45;

            left: -180px;
            bottom: -150px;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            padding-left: 25px;
        }

        .eyebrow {
            color: var(--pink);

            font-size: 11px;

            letter-spacing: 3px;

            font-weight: 700;

            margin-bottom: 15px;
        }

        .hero h1 {
            font-family: "Playfair Display", serif;

            font-size: clamp(48px, 6vw, 78px);

            line-height: 1.15;

            font-weight: 500;

            color: var(--text);

            margin-bottom: 25px;
        }

        .hero h1 span {
            color: var(--pink);
        }

        .hero-description {
            color: var(--muted);

            max-width: 510px;

            font-size: 15px;

            line-height: 2.1;
        }

        .hero-buttons {
            margin-top: 32px;

            display: flex;

            gap: 12px;

            align-items: center;
        }

        .primary-btn {
            background: var(--green);
            color: white;

            padding: 13px 28px;

            border-radius: 30px;

            font-size: 13px;

            transition: 0.3s;
        }

        .primary-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 35px rgba(63,93,73,0.20);
        }

        .secondary-btn {
            border: 1px solid #cbd2cb;

            color: #526057;

            padding: 12px 25px;

            border-radius: 30px;

            font-size: 13px;

            transition: 0.3s;
        }

        .secondary-btn:hover {
            border-color: var(--pink);
            color: var(--pink);
        }


        /* =========================
           HERO VISUAL
        ========================= */

        .hero-visual {
            min-height: 520px;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .visual-circle {
            width: 430px;
            height: 430px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #edf2ec,
                    #dfe9df
                );

            position: absolute;
        }

        .visual-card {
            width: 300px;
            min-height: 360px;

            position: relative;

            z-index: 2;

            background: rgba(255,255,255,0.70);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.9);

            border-radius: 30px;

            box-shadow:
                0 35px 80px rgba(45,65,52,0.15);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 35px;
        }

        .visual-logo {
            width: 175px;

            margin-bottom: 25px;
        }

        .visual-line {
            width: 55px;
            height: 1px;

            background: var(--pink);

            margin-bottom: 20px;
        }

        .visual-title {
            font-family: "Playfair Display", serif;

            color: var(--green);

            font-size: 25px;

            margin-bottom: 8px;
        }

        .visual-subtitle {
            font-size: 10px;

            letter-spacing: 2px;

            color: #778079;
        }

        .decor-one,
        .decor-two {
            position: absolute;

            border-radius: 50%;
        }

        .decor-one {
            width: 85px;
            height: 85px;

            background: #f0dadd;

            top: 55px;
            right: 5%;
        }

        .decor-two {
            width: 55px;
            height: 55px;

            background: #d5e2d5;

            bottom: 45px;
            left: 5%;
        }


        /* =========================
           SECTION
        ========================= */

        section {
            padding: 100px 8%;
        }

        .section-heading {
            text-align: center;

            max-width: 650px;

            margin: 0 auto 55px;
        }

        .section-heading small {
            color: var(--pink);

            font-size: 10px;

            letter-spacing: 3px;

            font-weight: 700;
        }

        .section-heading h2 {
            font-family: "Playfair Display", serif;

            color: var(--text);

            font-size: clamp(36px, 5vw, 50px);

            font-weight: 500;

            margin: 8px 0 10px;
        }

        .section-heading p {
            color: var(--muted);

            font-size: 13px;
        }


        /* =========================
           CATEGORIES
        ========================= */

        .categories {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .category {
            min-height: 280px;

            border-radius: 25px;

            padding: 30px;

            position: relative;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            justify-content: flex-end;

            transition: 0.4s;

            border: 1px solid rgba(255,255,255,0.7);
        }

        .category:hover {
            transform: translateY(-7px);

            box-shadow: var(--shadow);
        }

        .category::before {
            content: "";

            position: absolute;

            width: 210px;
            height: 210px;

            border-radius: 50%;

            background: rgba(255,255,255,0.38);

            top: -75px;
            left: -60px;
        }

        .category::after {
            content: "";

            position: absolute;

            width: 130px;
            height: 130px;

            border-radius: 50%;

            background: rgba(255,255,255,0.20);

            right: -50px;
            bottom: -40px;
        }

        .category:nth-child(1) {
            background: #eee7dc;
        }

        .category:nth-child(2) {
            background: #e3ece3;
        }

        .category:nth-child(3) {
            background: #f1e0e3;
        }

        .category-content {
            position: relative;
            z-index: 2;
        }

        .category-number {
            color: var(--pink);

            font-family: "Playfair Display", serif;

            font-size: 18px;

            margin-bottom: 5px;
        }

        .category h3 {
            font-family: "Playfair Display", serif;

            font-size: 34px;

            font-weight: 500;

            color: var(--text);
        }

        .category p {
            color: #6d776f;

            font-size: 11px;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products-section {
            background: #f3f0e9;
        }

        .product-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 22px;
        }

        .product-card {
            background: white;

            border-radius: 22px;

            overflow: hidden;

            border: 1px solid var(--border);

            transition: 0.35s;
        }

        .product-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 25px 50px rgba(45,60,48,0.11);
        }

        .product-image {
            height: 285px;

            background:
                radial-gradient(
                    circle at center,
                    #faf6f1,
                    #e7eee7
                );

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }

        .product-placeholder {
            width: 115px;
            height: 195px;

            border-radius:
                18px 18px 9px 9px;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #e6e1d8
                );

            box-shadow:
                0 20px 35px rgba(50,65,55,0.14);

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            color: var(--green);

            font-family: "Playfair Display", serif;

            font-size: 18px;
        }

        .product-placeholder::before {
            content: "";

            position: absolute;

            width: 45px;
            height: 16px;

            background: #536a59;

            top: 42px;

            border-radius: 5px;
        }

        .product-info {
            padding: 20px;
        }

        .product-category {
            color: var(--pink);

            font-size: 9px;

            letter-spacing: 1px;

            font-weight: 700;
        }

        .product-info h3 {
            color: var(--text);

            font-size: 17px;

            margin: 4px 0 6px;

            font-weight: 600;
        }

        .product-info p {
            color: var(--muted);

            font-size: 11px;

            line-height: 1.9;

            min-height: 63px;
        }

        .product-bottom {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 8px;

            margin-top: 12px;
        }

        .price {
            color: var(--green);

            font-size: 14px;

            font-weight: 700;
        }

        .order-small {
            background: var(--green);

            color: white;

            border-radius: 20px;

            padding: 7px 12px;

            font-size: 10px;
        }


        /* =========================
           INGREDIENTS
        ========================= */

        .ingredients-section {
            background: #fbfaf7;
        }

        .ingredient-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
        }

        .ingredient-card {
            background: white;

            border: 1px solid var(--border);

            border-radius: 20px;

            padding: 28px 22px;

            min-height: 205px;

            transition: 0.3s;
        }

        .ingredient-card:hover {
            transform: translateY(-5px);

            box-shadow: var(--shadow);
        }

        .ingredient-number {
            color: var(--pink);

            font-family: "Playfair Display", serif;

            font-size: 24px;
        }

        .ingredient-card h3 {
            font-family: "Playfair Display", serif;

            color: var(--green);

            font-size: 23px;

            margin: 8px 0;
        }

        .ingredient-card p {
            color: var(--muted);

            font-size: 11px;

            line-height: 2;
        }


        /* =========================
           ABOUT
        ========================= */

        .about-section {
            background: var(--soft-green);

            text-align: center;

            position: relative;

            overflow: hidden;
        }

        .about-section::before {
            content: "";

            position: absolute;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background: rgba(255,255,255,0.25);

            left: -150px;
            top: -100px;
        }

        .about-content {
            max-width: 760px;

            margin: auto;

            position: relative;
        }

        .about-content h2 {
            font-family: "Playfair Display", serif;

            font-size: clamp(38px, 5vw, 52px);

            font-weight: 500;

            color: var(--green);
        }

        .about-content p {
            color: #657168;

            font-size: 14px;

            line-height: 2.2;

            margin-top: 20px;
        }

        .signature {
            color: var(--pink);

            font-family: "Playfair Display", serif;

            font-size: 21px;

            margin-top: 25px;
        }


        /* =========================
           CTA
        ========================= */

        .cta {
            background: var(--green);

            color: white;

            padding: 65px 9%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 30px;
        }

        .cta small {
            color: #d9b2b8;

            font-size: 10px;

            letter-spacing: 2px;
        }

        .cta h2 {
            font-family: "Playfair Display", serif;

            font-size: 42px;

            font-weight: 500;

            margin-top: 4px;
        }

        .cta p {
            color: #dbe4dd;

            font-size: 12px;
        }

        .cta-button {
            background: white;

            color: var(--green);

            padding: 14px 27px;

            border-radius: 30px;

            font-size: 13px;

            white-space: nowrap;

            transition: 0.3s;
        }

        .cta-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(0,0,0,0.15);
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--dark-green);

            color: #cbd5ce;

            padding: 42px 8%;

            display: grid;

            grid-template-columns:
                1fr 1.5fr 1fr;

            align-items: center;

            gap: 20px;

            font-size: 10px;
        }

        footer .logo img {
            width: 125px;

            filter: brightness(0) invert(1);

            opacity: 0.95;
        }

        .footer-center {
            text-align: center;
        }

        .footer-right {
            text-align: left;
        }

           WHATSAPP FLOAT
        ========================= */

        .whatsapp-f
